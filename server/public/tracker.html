<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Private SOS location · Women Safety</title>
    <link rel="stylesheet" href="/tracker.css" />
    <script defer src="/tracker.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">WOMEN SAFETY / PRIVATE SOS LINK</p>
      <h1 id="title">Connecting to the alert…</h1>
      <p id="mode"></p>
      <section>
        <p id="status" role="status" aria-live="polite">
          Checking the latest location.
        </p>
        <p id="coordinates"></p>
        <p id="accuracy"></p>
        <a id="map" hidden target="_blank" rel="noreferrer noopener"
          >Open this location in maps ↗</a
        >
      </section>
      <p class="note">
        This page refreshes every 5 seconds. A location is only as recent as its
        timestamp. Do not forward this private link. Viewing it does not notify
        or dispatch emergency services.
      </p>
    </main>
  </body>
</html>
